name: Release ProxyBridge Windows

on:
  release:
    types: [published, created]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: self-hosted
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    # Keep release fail-closed until production signing and release integration are complete.
    - name: Require production PnP release integration
      run: throw 'PnP release packaging is gated. Use installer/build-signed-package.ps1 with explicitly verified inputs for rehearsal; unsigned CI output is not a release.'
      shell: pwsh
